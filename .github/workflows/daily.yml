name: Daily aggregator

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC every day
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write           # needed to commit status.json back to the repo

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/aggregator/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/aggregator/requirements.txt

      - name: Run aggregator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python backend/aggregator/aggregator.py

      - name: Commit updated status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/status.json
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "chore: update status.json [skip ci]"
          git push
