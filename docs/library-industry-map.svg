<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>

  <text x="480" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Where Zorvane's Six Libraries Sit in the Image-Editing Industry</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#666666">Apps compete on price and license — underneath, they share the same fragile open-source layer</text>

  <!-- Section labels -->
  <text x="20" y="95" font-size="11" font-weight="700" fill="#999999" letter-spacing="1">IMAGE-EDITING APPS</text>
  <text x="20" y="495" font-size="11" font-weight="700" fill="#999999" letter-spacing="1">SHARED OPEN-SOURCE LIBRARY LAYER</text>

  <!-- Connecting lines (drawn first, so boxes sit on top of line ends) -->
  <!-- Photoshop (orange, center x=185) -->
  <line x1="185" y1="140" x2="90"  y2="500" stroke="#E76F51" stroke-width="2.2" opacity="0.85"/>
  <line x1="185" y1="140" x2="714" y2="500" stroke="#E76F51" stroke-width="2" stroke-dasharray="7,5" opacity="0.6"/>
  <line x1="185" y1="140" x2="870" y2="500" stroke="#E76F51" stroke-width="2" stroke-dasharray="7,5" opacity="0.6"/>

  <!-- GIMP (teal, center x=480) -->
  <line x1="480" y1="140" x2="90"  y2="500" stroke="#2A9D8F" stroke-width="2.2" opacity="0.85"/>
  <line x1="480" y1="140" x2="246" y2="500" stroke="#2A9D8F" stroke-width="2.2" opacity="0.85"/>
  <line x1="480" y1="140" x2="402" y2="500" stroke="#2A9D8F" stroke-width="2.2" opacity="0.85"/>
  <line x1="480" y1="140" x2="558" y2="500" stroke="#2A9D8F" stroke-width="2.2" opacity="0.85"/>
  <line x1="480" y1="140" x2="714" y2="500" stroke="#2A9D8F" stroke-width="2.2" opacity="0.85"/>
  <line x1="480" y1="140" x2="870" y2="500" stroke="#2A9D8F" stroke-width="2.2" opacity="0.85"/>

  <!-- Krita (purple, center x=775) -->
  <line x1="775" y1="140" x2="90"  y2="500" stroke="#6A4C93" stroke-width="2.2" opacity="0.85"/>
  <line x1="775" y1="140" x2="246" y2="500" stroke="#6A4C93" stroke-width="2.2" opacity="0.85"/>
  <line x1="775" y1="140" x2="402" y2="500" stroke="#6A4C93" stroke-width="2.2" opacity="0.85"/>
  <line x1="775" y1="140" x2="714" y2="500" stroke="#6A4C93" stroke-width="2.2" opacity="0.85"/>
  <line x1="775" y1="140" x2="870" y2="500" stroke="#6A4C93" stroke-width="2.2" opacity="0.85"/>

  <!-- Connection dots on the library edge -->
  <circle cx="90"  cy="500" r="4" fill="#E76F51"/>
  <circle cx="90"  cy="500" r="4" fill="none" stroke="#2A9D8F" stroke-width="1.5" transform="translate(-6,0)"/>
  <circle cx="714" cy="500" r="4" fill="#E76F51" opacity="0.7"/>
  <circle cx="870" cy="500" r="4" fill="#E76F51" opacity="0.7"/>

  <!-- App boxes -->
  <rect x="75"  y="70" width="220" height="70" rx="10" fill="#FCEBE6" stroke="#E76F51" stroke-width="2"/>
  <text x="185" y="102" text-anchor="middle" font-size="17" font-weight="700" fill="#B0442B">Photoshop</text>
  <text x="185" y="122" text-anchor="middle" font-size="11" fill="#B0442B">proprietary · Adobe</text>

  <rect x="370" y="70" width="220" height="70" rx="10" fill="#E7F5F3" stroke="#2A9D8F" stroke-width="2"/>
  <text x="480" y="102" text-anchor="middle" font-size="17" font-weight="700" fill="#1D6E64">GIMP</text>
  <text x="480" y="122" text-anchor="middle" font-size="11" fill="#1D6E64">open source</text>

  <rect x="665" y="70" width="220" height="70" rx="10" fill="#EFE9F4" stroke="#6A4C93" stroke-width="2"/>
  <text x="775" y="102" text-anchor="middle" font-size="17" font-weight="700" fill="#4E3768">Krita</text>
  <text x="775" y="122" text-anchor="middle" font-size="11" fill="#4E3768">open source</text>

  <!-- Library boxes -->
  <rect x="20"  y="500" width="140" height="70" rx="10" fill="#F4F4F4" stroke="#555555" stroke-width="1.5"/>
  <text x="90" y="530" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">FreeType</text>
  <text x="90" y="548" text-anchor="middle" font-size="10" fill="#666666">font rendering</text>

  <rect x="176" y="500" width="140" height="70" rx="10" fill="#F4F4F4" stroke="#555555" stroke-width="1.5"/>
  <text x="246" y="530" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">libpng</text>
  <text x="246" y="548" text-anchor="middle" font-size="10" fill="#666666">PNG codec</text>

  <rect x="332" y="500" width="140" height="70" rx="10" fill="#F4F4F4" stroke="#555555" stroke-width="1.5"/>
  <text x="402" y="530" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">LittleCMS</text>
  <text x="402" y="548" text-anchor="middle" font-size="10" fill="#666666">color management</text>

  <rect x="488" y="500" width="140" height="70" rx="10" fill="#F4F4F4" stroke="#555555" stroke-width="1.5"/>
  <text x="558" y="530" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">Ghostscript</text>
  <text x="558" y="548" text-anchor="middle" font-size="10" fill="#666666">PostScript/PDF</text>

  <rect x="644" y="500" width="140" height="70" rx="10" fill="#F4F4F4" stroke="#555555" stroke-width="1.5"/>
  <text x="714" y="530" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">libjpeg-turbo</text>
  <text x="714" y="548" text-anchor="middle" font-size="10" fill="#666666">JPEG codec</text>

  <rect x="800" y="500" width="140" height="70" rx="10" fill="#F4F4F4" stroke="#555555" stroke-width="1.5"/>
  <text x="870" y="530" text-anchor="middle" font-size="14" font-weight="700" fill="#222222">libtiff</text>
  <text x="870" y="548" text-anchor="middle" font-size="10" fill="#666666">TIFF codec</text>

  <!-- Legend -->
  <rect x="20" y="590" width="920" height="40" rx="6" fill="#FAFAFA" stroke="#DDDDDD" stroke-width="1"/>
  <line x1="35" y1="602" x2="65" y2="602" stroke="#333333" stroke-width="2.2"/>
  <text x="72" y="606" font-size="11" fill="#333333">solid = confirmed dependency</text>
  <line x1="245" y1="602" x2="275" y2="602" stroke="#333333" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="282" y="606" font-size="11" fill="#333333">dashed = commonly used, unconfirmed for this app</text>

  <circle cx="560" cy="602" r="6" fill="#E76F51"/>
  <text x="572" y="606" font-size="11" fill="#333333">Photoshop</text>
  <circle cx="650" cy="602" r="6" fill="#2A9D8F"/>
  <text x="662" y="606" font-size="11" fill="#333333">GIMP</text>
  <circle cx="720" cy="602" r="6" fill="#6A4C93"/>
  <text x="732" y="606" font-size="11" fill="#333333">Krita</text>

  <text x="480" y="622" text-anchor="middle" font-size="10" fill="#999999">Zorvane tracks all six boxes in the bottom row, regardless of which app(s) above depend on them.</text>
</svg>
